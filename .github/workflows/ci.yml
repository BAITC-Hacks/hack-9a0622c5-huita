name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Block private data and credentials
        run: |
          python scripts/check_repository.py --all
          python scripts/check_repository.py --history HEAD
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Test without organizer datasets
        run: python -m pytest tests -q
      - name: Verify committed frontend contract
        run: python scripts/export_openapi.py --check
