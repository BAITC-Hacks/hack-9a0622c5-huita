services:
  beesmart:
    build: .
    image: beesmart-backend:local
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:size=128m,mode=1777,noexec,nosuid,nodev
    environment:
      BEESMART_ENVIRONMENT: production
      BEESMART_HOST: 0.0.0.0
      BEESMART_PORT: "8000"
      BEESMART_API_TOKEN: ${BEESMART_API_TOKEN:?Run scripts/setup_env.py and configure the private .env}
      BEESMART_ALLOWED_HOSTS: ${BEESMART_ALLOWED_HOSTS:?Set explicit allowed hostnames}
      BEESMART_ALLOWED_ORIGINS: ${BEESMART_ALLOWED_ORIGINS:-}
      BEESMART_STORAGE_DIR: /var/lib/beesmart
      BEESMART_DATA_DIR: /var/lib/beesmart/source
      BEESMART_FORWARDED_ALLOW_IPS: 172.31.250.2
      BEESMART_LOG_LEVEL: ${BEESMART_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - beesmart_storage:/var/lib/beesmart
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; h=os.environ['BEESMART_ALLOWED_HOSTS'].split(',')[0].strip(); r=urllib.request.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}); assert urllib.request.urlopen(r,timeout=4).status==200"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
    deploy:
      replicas: 1
    networks:
      backend:
        ipv4_address: 172.31.250.3

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    profiles: [tls]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      BEESMART_DOMAIN: ${BEESMART_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    depends_on:
      beesmart:
        condition: service_healthy
    networks:
      backend:
        ipv4_address: 172.31.250.2

volumes:
  beesmart_storage:
  caddy_data:
  caddy_config:

networks:
  backend:
    ipam:
      config:
        - subnet: 172.31.250.0/28
